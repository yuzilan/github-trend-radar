name: Bug report
description: Report a reproducible problem in GitHub Trend Radar
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove tokens, personal preference data, and private paths before posting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.6.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command or natural-language request and the complete error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Agent client.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste redacted output from `python3 scripts/doctor.py --offline` when possible.
