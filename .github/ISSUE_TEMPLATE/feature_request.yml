name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What are you trying to accomplish, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the observable result, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and privacy boundaries
      description: Should this read or write preferences, use network access, or run third-party code?
